<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar al Sistema</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <div class="logo-container">
                    <div class="logo">🎓</div>
                </div>
                <h2>Ingresar al sistema</h2>
            </div>

            <div class="info-box">
                <div class="univalle-logo">
                    <div class="logo-placeholder">U</div>
                </div>
                <p class="info-text">
                    Si usted es <strong>ESTUDIANTE</strong>, recuerde imprimir su tabulado cada 
                    vez que realice procesos de <strong>adición/cancelación de asignaturas</strong>. 
                    Este documento podría ser de utilidad para cualquier reclamación.
                </p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Login:</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Ingrese su código"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="••••••••••"
                        required
                    >
                </div>

                <div class="error-message" id="errorMessage" style="display: none;"></div>

                <div class="button-group">
                    <button type="submit" class="btn-primary">Ingresar al Sistema</button>
                    <button type="button" class="btn-secondary" onclick="clearForm()">Limpiar</button>
                </div>
            </form>

            <div class="links">
                <a href="#" onclick="alert('Funcionalidad en desarrollo')">Cambiar Contraseña</a>
                <span class="separator">|</span>
                <a href="#" onclick="alert('Funcionalidad en desarrollo')">Olvidé mi contraseña</a>
            </div>

            <div class="help-link">
                <a href="#" onclick="alert('Guía en desarrollo')">
                    <span class="help-icon">❓</span>
                    Ver Guía
                </a>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
